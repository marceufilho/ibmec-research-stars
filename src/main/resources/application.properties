spring.application.name=ibmec-research-stars
server.port=8080

# Banco de dados SQLite (arquivo em data/ibmec.db). Ajustavel via IRS_DB_PATH.
spring.datasource.url=jdbc:sqlite:${IRS_DB_PATH:data/ibmec.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite suporta apenas uma conexao de escrita; manter o pool pequeno evita "database is locked".
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

# Flyway desabilitado: o schema e gerenciado pelo Hibernate (ddl-auto=update)
# para manter compatibilidade com as entidades atuais.
spring.flyway.enabled=false

# JWT (HS256). Em producao, sobrescreva via variavel de ambiente APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:Y2hhbmdlLXRoaXMtc2VjcmV0LWluLXByb2R1Y3Rpb24taWJtZWMtcmVzZWFyY2gtc3RhcnMtMjAyNg==}
app.jwt.expiration-ms=86400000

# CORS para o frontend (Vite)
app.cors.allowed-origins=http://localhost:5173

# OpenAPI / Swagger UI em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
